# rag-evaluation-system configuration
# Copy to config/local.yaml and customise; local.yaml is gitignored.

# ── Ingestion ────────────────────────────────────────────────────────────────
ingestion:
  supported_extensions: [".txt", ".md", ".pdf", ".docx"]
  encoding: "utf-8"

# ── Chunking ─────────────────────────────────────────────────────────────────
chunking:
  strategy: "recursive"     # fixed | recursive | semantic
  chunk_size: 512           # target characters (fixed/recursive) or tokens
  chunk_overlap: 64         # character overlap between consecutive chunks
  # semantic chunker only
  semantic_threshold: 0.85  # cosine similarity threshold to merge sentences

# ── Embedding ─────────────────────────────────────────────────────────────────
embedding:
  provider: "sentence_transformers"   # sentence_transformers | openai
  # sentence_transformers backend
  model_name: "all-MiniLM-L6-v2"
  # openai backend
  # model_name: "text-embedding-3-small"
  batch_size: 64
  normalize: true

# ── Vector Store ──────────────────────────────────────────────────────────────
vector_store:
  index_path: "data/faiss_index"
  metric: "cosine"          # cosine | l2

# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  top_k: 5
  method: "mmr"             # dense | mmr
  # MMR: trade-off between relevance (1.0) and diversity (0.0)
  mmr_lambda: 0.6
  # fetch_k candidates before MMR re-ranking
  mmr_fetch_k: 20

# ── Generation ────────────────────────────────────────────────────────────────
generation:
  provider: "openai"        # openai | anthropic
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 512
  system_prompt: |
    You are a precise, factual assistant. Answer the user's question using ONLY
    the provided context. If the context does not contain sufficient information,
    state that clearly rather than speculating. Be concise and accurate.

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  # which metrics to run
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
    - rouge_l
    - latency
    - token_efficiency
  # LLM used as judge for faithfulness, context_precision, context_recall
  judge_model: "gpt-4o-mini"
  judge_temperature: 0.0
  # output directory for reports
  output_dir: "results"
  report_formats: ["console", "csv", "json"]
